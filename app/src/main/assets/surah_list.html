        let readingSurahId = 0;
        let downloadedSurahs = [];
        let downloadingIds = []; // جراحة: تتبع السور الجاري تحميلها

        window.onDownloadedSurahsReceived = function(b64) {
            try {
                const data = JSON.parse(window.decodeSafeData(b64));
                downloadedSurahs = data;
                // جراحة: تحديث حالة التحميل الجاري
                downloadingIds = downloadingIds.filter(id => !downloadedSurahs.includes(id));
                renderSurahCards(QURAN_CHAPTERS);
            } catch(e) {}
        };

        window.onLastRead = function(b64) {
            try {
                const data = JSON.parse(window.decodeSafeData(b64));
                readingSurahId = data.surah;
                renderSurahCards(QURAN_CHAPTERS);
            } catch(e) {}
        };

        window.onload = function() {
            renderSurahCards(QURAN_CHAPTERS);
            const bridge = window.AndroidBridge || (window.parent && window.parent.AndroidBridge);
            if(bridge) {
                if(typeof bridge.getLastRead === 'function') bridge.getLastRead();
                if(typeof bridge.getDownloadedSurahs === 'function') bridge.getDownloadedSurahs();
            }
        };

        function startDownload(event, surahId, iconElement) {
            event.stopPropagation();
            if (downloadingIds.includes(surahId)) return;

            downloadingIds.push(surahId);
            iconElement.classList.add('downloading-act');

            const bridge = window.AndroidBridge || (window.parent && window.parent.AndroidBridge);
            if(bridge && typeof bridge.downloadSurah === 'function') {
                const reciterId = localStorage.getItem('q_rec') || 'Maher_AlMuaiqly_64kbps';
                bridge.downloadSurah(surahId, reciterId);
                const sName = QURAN_CHAPTERS.find(s => s.id === surahId).name;
                if(typeof bridge.showToast === 'function') bridge.showToast("بدء تحميل سورة " + sName + "...");
            }
        }

        function deleteSurah(event, surahId) {
            event.stopPropagation();
            if(!confirm("هل تريد حذف هذه السورة من الجهاز؟")) return;
            const bridge = window.AndroidBridge || (window.parent && window.parent.AndroidBridge);
            if(bridge && typeof bridge.deleteSurah === 'function') {
                bridge.deleteSurah(surahId);
            }
        }

        function renderSurahCards(list) {
            const container = document.getElementById('surah-list-container');
            if (!container) return;
            container.innerHTML = list.map(s => {
                const isDownloaded = downloadedSurahs.includes(s.id);
                const isDownloading = downloadingIds.includes(s.id);
                return `
                <div class="surah-card ${s.id === readingSurahId ? 'active-reading' : ''}" onclick="window.parent.loadPage('reading', {surah:${s.id}})">
                    <div class="num-ornament-wrap">
                        <div class="num-ornament-shape"></div>
                        <div class="num-text">${window.toArDigits(s.id)}</div>
                    </div>
                    <div class="surah-details">
                        <h3>${s.name}</h3>
                        <div class="surah-meta">${s.type} • ${window.toArDigits(s.ayahs)} آية</div>
                    </div>
                    <span class="material-symbols-rounded download-icon ${isDownloaded ? 'downloaded' : ''} ${isDownloading ? 'downloading-act' : ''}"
                          onclick="${isDownloaded ? 'deleteSurah(event, ' + s.id + ')' : 'startDownload(event, ' + s.id + ', this)'}">
                        ${isDownloaded ? 'delete' : (isDownloading ? 'sync' : 'cloud_download')}
                    </span>
                </div>
            `;}).join('');
        }

        function filterSurahs() {
            const query = document.getElementById('surahSearch').value.trim();
            const filtered = query ? QURAN_CHAPTERS.filter(s => s.name.includes(query) || s.id.toString().includes(query)) : QURAN_CHAPTERS;
            renderSurahCards(filtered);
        }
