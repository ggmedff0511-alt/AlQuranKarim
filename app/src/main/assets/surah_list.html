<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>قائمة السور - المصحف الكوني</title>
    <!-- تعليق جراحي: استعادة روابط الخطوط والأيقونات الخارجية لضمان استقرار العرض -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="style.css">
    <!-- تعليق جراحي: ربط ملف التنسيقات الخاص بالفهرس لضمان المظهر المتناسق -->
    <link rel="stylesheet" href="surah_list.css">
</head>
<body>
    <div id="surah-list-screen">
        <!-- تعليق جراحي: تحسين الهيدر ليتناسب مع الصورة المرجعية (العنوان أبيض وعلى اليمين) -->
        <header style="padding: 40px 25px 15px; background: #020611; display: flex; justify-content: flex-start; align-items: center;">
            <h1 style="color: #FFFFFF; font-family: 'Tajawal'; font-weight: 900; font-size: 2.5rem; margin: 0; text-align: right; flex: 1;">سور القرآن الكريم</h1>
        </header>

        <!-- تعليق جراحي: تعديل صندوق البحث لضمان تواجد الأيقونة في المكان الصحيح (اليسار) والوضوح التام -->
        <div class="search-area" style="padding: 10px 25px 25px; background: #020611;">
            <div class="search-input-wrap" style="background: #111b2d !important; border: 1px solid rgba(232, 193, 114, 0.2); border-radius: 4px; display: flex; align-items: center; padding: 10px 15px; gap: 10px;">
                <input type="text" id="surah-search" placeholder="ابحث عن سورة..." oninput="filterSurahs()"
                       style="background: transparent !important; border: none !important; color: #FFF !important; flex: 1; font-family: 'Tajawal'; font-size: 1.2rem; outline: none; text-align: right;">
                <span class="material-symbols-rounded" style="color: #FFFFFF; font-size: 28px; cursor: pointer;">search</span>
            </div>
        </div>

        <div id="surah-container" class="surah-grid">
            <!-- تعليق جراحي: إضافة مؤشر تحميل مؤقت يختفي عند تحميل البيانات -->
            <div id="loading-msg" style="text-align:center; padding:50px; color: #E8C172; font-family: 'Tajawal'; font-size: 1.1rem; opacity: 0.7;">جاري تحميل الفهرس...</div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        /**
         * تعليق جراحي: محرك الفهرس المطور - إصلاح مشكلة المزامنة عند فتح السورة
         */
        let allSurahs = [];

        function toAr(n) {
            if (window.toArDigits) return window.toArDigits(n);
            const id = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return String(n).replace(/[0-9]/g, w => id[parseInt(w)]);
        }

        async function initSurahList() {
            const container = document.getElementById('surah-container');

            try {
                const response = await fetch('surahs.json');
                if (response.ok) {
                    allSurahs = await response.json();
                } else { throw new Error(); }
            } catch (e) {
                const names = window.surahNames || (window.parent && window.parent.surahNames);
                if (names && names.length > 1) {
                    allSurahs = names.slice(1).map((name, i) => ({
                        id: i + 1, name: name, type: "سورة", ayahs: 0
                    }));
                }
            }

            if (allSurahs.length > 0) {
                renderSurahs(allSurahs);
                if (window.parent && window.parent.callNative) {
                    window.parent.callNative('getDownloadedSurahs');
                    window.parent.callNative('getLastRead');
                }
            } else {
                setTimeout(initSurahList, 500);
            }
        }

        function renderSurahs(surahs) {
            const container = document.getElementById('surah-container');
            if (!container) return;

            if (surahs.length === 0) {
                container.innerHTML = '<div class="empty-results">لا توجد نتائج مطابقة</div>';
                return;
            }

            container.innerHTML = surahs.map(s => `
                <div class="surah-card" onclick="openSurah(${s.id})">
                    <div class="num-ornament-wrap">
                        <div class="num-ornament-shape"></div>
                        <span class="num-text">${toAr(s.id)}</span>
                    </div>
                    <div class="surah-details">
                        <h3>${s.name}</h3>
                        <div class="surah-meta">
                            <span>${s.type}</span> ${s.ayahs > 0 ? `• <span>${toAr(s.ayahs)} آية</span>` : ''}
                        </div>
                    </div>
                    <span class="material-symbols-rounded download-icon" id="download-${s.id}"
                          onclick="event.stopPropagation(); downloadSurah(${s.id}, '${s.name}')">
                        download_for_offline
                    </span>
                </div>
            `).join('');
        }

        function filterSurahs() {
            const query = document.getElementById('surah-search').value.trim().toLowerCase();
            const filtered = allSurahs.filter(s =>
                s.name.includes(query) ||
                s.id.toString().includes(query)
            );
            renderSurahs(filtered);
        }

        /**
         * تعليق جراحي: تفعيل المتابعة التلقائية (followAudio) فور فتح السورة
         */
        function openSurah(id) {
            if (window.parent && window.parent.loadPage) {
                // تصفير المفتاح الأخير لضمان إعادة التظليل في الشاشة الجديدة
                if (window.parent.AudioStatus) {
                    window.parent.followAudio = true;
                }
                window.parent.loadPage('reading', { surah: id, ayah: 1 });
            }
        }

        function downloadSurah(id, name) {
            if (window.parent && window.parent.callNative) {
                window.parent.callNative('downloadSurah', id, 'Maher_AlMuaiqly_64kbps');
                window.parent.callNative('showToast', 'بدء تحميل سورة ' + name);
            }
        }

        window.onDownloadedSurahsReceived = function(b64) {
            try {
                const json = window.parent.decodeSafeData ? window.parent.decodeSafeData(b64) : atob(b64);
                const downloadedIds = JSON.parse(json);
                downloadedIds.forEach(id => {
                    const icon = document.getElementById('download-' + id);
                    if (icon) {
                        icon.classList.add('downloaded');
                        icon.innerText = 'check_circle';
                    }
                });
            } catch(e) {}
        };

        window.onLastRead = function(b64) {
            try {
                const json = window.parent.decodeSafeData ? window.parent.decodeSafeData(b64) : atob(b64);
                const data = JSON.parse(json);
                const cards = document.querySelectorAll('.surah-card');
                cards.forEach(card => {
                    if (card.getAttribute('onclick').includes(`(${data.surah})`)) {
                        card.classList.add('active-reading');
                    }
                });
            } catch(e) {}
        };

        document.addEventListener('DOMContentLoaded', initSurahList);
    </script>
</body>
</html>
