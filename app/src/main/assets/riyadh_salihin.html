<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>رياض الصالحين - المصحف الكوني</title>
    <!-- استدعاء المواد الرسومية والخطوط الموحدة للتطبيق -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="common.css">
    <style>
        :root {
            --cosmos-bg: #02050A;
            --cosmos-panel: #0A1628;
            --cosmos-gold: #D9B24C;
            --cosmos-text: #E0E6ED;
            --cosmos-muted: #A8B4C7;
            --cosmos-border: rgba(217, 178, 76, 0.15);
        }
        body { background: var(--cosmos-bg); color: var(--cosmos-text); font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; direction: rtl; }
        #app-screen { padding: 20px; padding-top: calc(env(safe-area-inset-top) + 10px); }

        /* الهيدر الموحد: مطابق لتصميم المكتبة الإسلامية والصحاح */
        .lib-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 25px; }
        .back-btn-circle {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.03); border: 1px solid var(--cosmos-border);
            color: var(--cosmos-gold); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
        }
        .lib-title { color: var(--cosmos-gold); font-size: 1.6rem; font-weight: 900; margin: 0; flex: 1; text-align: right; }

        /* تصميم بطاقة الحديث الكونية */
        .hadith-card {
            background: var(--cosmos-panel); border-radius: 26px; padding: 22px;
            margin-bottom: 22px; border: 1px solid var(--cosmos-border);
            box-shadow: 0 12px 35px rgba(0,0,0,0.4);
        }
        .hadith-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px dashed var(--cosmos-border); padding-bottom: 12px; }
        .hadith-number { background: var(--cosmos-gold); color: #02050A; font-weight: 900; width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
        .hadith-title { font-weight: 800; color: var(--cosmos-gold); font-size: 1.1rem; }
        .hadith-text { font-family: 'Amiri', serif; font-size: 1.5rem; line-height: 2.2; text-align: justify; color: #fff; }
    </style>
</head>
<body>
    <div id="app-screen">
        <!-- الهيدر الموحد -->
        <header class="lib-header">
            <h1 class="lib-title">رياض الصالحين</h1>
            <button class="back-btn-circle" onclick="window.parent.loadPage('library')">
                <span class="material-symbols-rounded">arrow_forward</span>
            </button>
        </header>

        <!-- حاوية عرض الأحاديث -->
        <div id="hadith-container">
            <div style="text-align:center; padding:60px; opacity:0.6;"><p>جاري تحميل أحاديث رياض الصالحين...</p></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // التهيئة وطلب البيانات عند التحميل
        window.onload = function() {
            if (window.parent && window.parent.callNative) {
                // طلب بيانات رياض الصالحين من نظام أندرويد
                window.parent.callNative('getHadiths', 'riyadh', 'onHadithsLoaded');
            }
        };

        // استقبال البيانات وعرضها ديناميكياً
        window.onHadithsLoaded = function(jsonB64) {
            try {
                const data = JSON.parse(decodeSafeData(jsonB64));
                let html = '';
                data.forEach((h, i) => {
                    html += `<div class="hadith-card">
                        <div class="hadith-header">
                            <span class="hadith-title">${h.title || 'باب'}</span>
                            <span class="hadith-number">${toArDigits(i + 1)}</span>
                        </div>
                        <div class="hadith-text">${h.text}</div>
                    </div>`;
                });
                document.getElementById('hadith-container').innerHTML = html;
            } catch(e) {
                document.getElementById('hadith-container').innerHTML = '<p style="text-align:center;">تعذر تحميل البيانات حالياً.</p>';
            }
        };

        // دالة فك التشفير الآمنة للبيانات القادمة من أندرويد
        function decodeSafeData(b64) { try { return decodeURIComponent(escape(atob(b64))); } catch(e) { return atob(b64); } }
    </script>
</body>
</html>
