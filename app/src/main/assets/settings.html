<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الإعدادات - المصحف الكوني</title>
    <!-- تعليق جراحي: استعادة روابط الخطوط والأيقونات الخارجية لضمان استقرار العرض -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div id="settings-screen">
        <header class="settings-header">
            <!-- أيقونة المشاركة جهة اليسار -->
            <button class="btn-head-action" onclick="window.callNative('shareText', 'تطبيق المصحف الكوني - رفيقك للقرآن الكريم')">
                <span class="material-symbols-rounded">share</span>
            </button>
            <h2>الإعدادات</h2>
            <!-- زر العودة جهة اليمين -->
            <button class="btn-head-action" onclick="goBack()">
                <span class="material-symbols-rounded">arrow_forward</span>
            </button>
        </header>

        <main class="settings-content" id="settings-container">
            <!-- سيتم بناء الإعدادات هنا جراحياً عبر JS لضمان الفاعلية -->
        </main>
    </div>

    <!-- استدعاء المنطق البرمجي (Surgical Edit) -->
    <script src="script.js"></script>
    <script src="settings.js"></script>
</body>
</html>
