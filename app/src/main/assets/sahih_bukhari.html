<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صحيح البخاري - المصحف الكوني</title>
    <!-- تعليق جراحي: استعادة روابط الخطوط والأيقونات الخارجية لضمان استقرار العرض -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="sahih_bukhari.css">
    <style>
        /* تعليق جراحي: تحسين تصميم شريط البحث ليطابق الصورة */
        .search-box {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid rgba(217, 178, 76, 0.1);
        }
        .search-box input {
            background: none; border: none; color: #fff;
            flex: 1; font-family: inherit; outline: none; margin-right: 10px;
        }

        /* تعليق جراحي: تصميم بطاقة "الكتاب" في الفهرس كما في الصورة */
        .chapter-card {
            background: var(--cosmos-panel);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--cosmos-border);
            cursor: pointer;
            transition: 0.3s;
        }
        .chapter-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .chapter-name { font-weight: 800; font-size: 1.15rem; color: #fff; }
        .chapter-meta { font-size: 0.8rem; color: var(--cosmos-muted); }
        .chapter-num-box {
            width: 44px; height: 44px;
            background: var(--cosmos-gold);
            color: #02050A;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            margin-left: 15px;
        }
        .arrow-left { color: var(--cosmos-gold); font-size: 1.2rem !important; }
    </style>
</head>
<body>
    <div id="app-screen">
        <header class="lib-header">
            <!-- تعليق جراحي: استخدام وظيفة goBack() لدعم الرجوع المتعدد المستويات داخل الكتاب -->
            <button class="back-btn-circle" onclick="goBack()">
                <span class="material-symbols-rounded">arrow_forward</span>
            </button>
            <h1 class="lib-title">صحيح البخاري</h1>
            <div style="width:44px;"></div>
        </header>

        <!-- شريط البحث المضاف جراحياً -->
        <div class="search-box">
            <span class="material-symbols-rounded" style="color: var(--cosmos-gold); font-size: 1.3rem !important;">search</span>
            <input type="text" placeholder="بحث في صحيح البخاري..." oninput="filterChapters(this.value)">
        </div>

        <div id="hadith-container">
            <!-- سيتم تحميل "فهرس الكتب" هنا ديناميكياً -->
            <div style="text-align:center; padding:60px; opacity:0.6;"><p>جاري تحميل الفهرس...</p></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="sahih_bukhari.js"></script>
</body>
</html>
