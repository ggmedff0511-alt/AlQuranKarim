<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المصحف الكوني - الدقة العالية</title>
    <!-- تعليق جراحي: استعادة روابط الخطوط والأيقونات الخارجية لضمان استقرار العرض وحل الأخطاء الناتجة عن محاولة العمل بدون إنترنت -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="common.css?v=2.0">
    <link rel="stylesheet" href="style.css?v=2.0">
    <link rel="stylesheet" href="welcome.css?v=2.0">
    <link rel="stylesheet" href="quran_ui.css?v=2.0">
</head>
<body>
    <div id="splash-screen">
        <div class="crescent-top"></div>
        <div class="central-glow"></div>
        <div style="z-index: 10; width: 100%;">
            <div class="logo-glow-wrap">
                <img src="file:///android_res/drawable/logo" class="logo-img-main" alt="Logo">
            </div>
            <h1 class="welcome-title-text">المصحف الكوني</h1>
            <p class="welcome-tagline">رفيقك في رحلتك مع كتاب الله</p>
        </div>

        <div class="verse-card-splash">
            <div class="verse-txt-splash">إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا كَبِيرًا</div>
            <div class="verse-ref-splash">سورة الإسراء: ٩</div>
        </div>

        <button class="btn-start-journey" onclick="closeWelcomeScreen()">
            <span>ابدأ الرحلة</span>
            <span class="material-symbols-rounded" style="font-size: 1.2rem; margin-right: 8px;">chevron_left</span>
        </button>
    </div>

    <div id="app-shell">
        <iframe id="page-loader-frame" name="page-loader-frame"></iframe>
        <nav id="global-nav">
            <a class="nav-item" id="nav-home" onclick="loadPage('home')">
                <span class="material-symbols-rounded">home</span>
                <span>الرئيسية</span>
            </a>
            <a class="nav-item" id="nav-surah_list" onclick="loadPage('surah_list')">
                <span class="material-symbols-rounded">menu_book</span>
                <span>المصحف</span>
            </a>
            <!-- تعليق جراحي: إضافة زر المكتبة للقائمة السفلية لضمان فتح نسخة الويب (library.html) بدلاً من الشاشات البرمجية القديمة -->
            <a class="nav-item" id="nav-library" onclick="loadPage('library')">
                <span class="material-symbols-rounded">local_library</span>
                <span>المكتبة</span>
            </a>
            <a class="nav-item" id="nav-reciters" onclick="loadPage('reciters')">
                <span class="material-symbols-rounded">headphones</span>
                <span>التلاوات</span>
            </a>
            <a class="nav-item" id="nav-settings" onclick="loadPage('settings')">
                <span class="material-symbols-rounded">settings</span>
                <span>الإعدادات</span>
            </a>
        </nav>
    </div>

    <script src="quran_ui.js?v=2.0"></script>
</body>
</html>
